{% extends 'catalog/base.html' %}
{% load static %}

{% block title %}Удаление статьи - Skystore{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Подтверждение удаления
                    </h4>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить статью?</p>
                    <p class="fw-bold">"{{ object.title }}"</p>
                    <p class="text-muted">Это действие нельзя отменить.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>
                                Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash me-2"></i>
                                Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
