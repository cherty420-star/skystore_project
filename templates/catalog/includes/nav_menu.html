<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="{% url 'catalog:home' %}">
            <i class="bi bi-cloud-fill me-2"></i>
            Skystore
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                       href="{% url 'catalog:home' %}">
                        <i class="bi bi-house-door me-1"></i>
                        Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'blog_list' %}active{% endif %}"
                       href="{% url 'blog:blog_list' %}">
                        <i class="bi bi-newspaper me-1"></i>
                        Блог
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}"
                       href="{% url 'catalog:contacts' %}">
                        <i class="bi bi-telephone me-1"></i>
                        Контакты
                    </a>
                </li>
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'product_create' %}active{% endif %}"
                       href="{% url 'catalog:product_create' %}">
                        <i class="bi bi-plus-circle me-1"></i>
                        Добавить товар
                    </a>
                </li>
                {% endif %}
            </ul>
            <div class="d-flex">
                {% if user.is_authenticated %}
                <div class="dropdown">
                    <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        {{ user.email|truncatechars:20 }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="{% url 'users:profile' %}">
                                <i class="bi bi-gear me-2"></i>
                                Профиль
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item text-danger" href="{% url 'users:logout' %}">
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Выйти
                            </a>
                        </li>
                    </ul>
                </div>
                {% else %}
                <a href="{% url 'users:login' %}" class="btn btn-outline-primary me-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Войти
                </a>
                <a href="{% url 'users:register' %}" class="btn btn-primary">
                    <i class="bi bi-person-plus me-1"></i>
                    Регистрация
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
